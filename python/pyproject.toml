[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rgpu"
version = "0.1.1"
description = "A PyTorch device whose tensors live on a remote GPU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yan Michalevsky" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["torch>=2.14"]

[project.urls]
Documentation = "https://rgpu.dev/docs/"
Source = "https://github.com/ymcrcat/rgpu"

[project.optional-dependencies]
test = ["pytest>=8", "torchvision"]

[project.scripts]
rgpu-opserver = "rgpu.server.__main__:main"
rgpu-run = "rgpu_run:main"

[tool.setuptools]
# A top-level module on purpose: the launcher only opens an ssh tunnel and
# spawns a child, so importing the rgpu package - which registers the device
# and pulls in torch, about three seconds - would be pure startup cost.
py-modules = ["rgpu_run"]

[tool.setuptools.packages.find]
include = ["rgpu*"]
