name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate driver and runtime sources
        run: PLATFORM=linux/amd64 ./codegen/run.sh
      - name: Check generated sources
        run: git diff --exit-code -- client/generated common/generated server/generated tests/generated codegen/runtime_api.json
      - name: Build client and run C++ tests
        run: PLATFORM=linux/amd64 ./scripts/build_client.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e './python[test]'
      - run: python -m pytest python/tests -q

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
